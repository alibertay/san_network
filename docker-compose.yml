services:
  node:
    build: .
    image: san-network:local
    ports:
      - "8000:8000"   # REST API
      - "8765:8765"   # gRPC P2P (block gossip + sync)
      - "8769:8769"   # gRPC P2P (controller votes)
      - "8770:8770"   # gRPC P2P (peer discovery / gossip)
    environment:
      SAN_API_PORT: "8000"
      SAN_ADVERTISE_HOST: "127.0.0.1"
      # Persistence + identity live in the volume
      SAN_DB_PATH: "/data/node.kv"
      SAN_KEY_FILE: "/data/san_key.json"
      # Optional: fund an address at genesis, join a seed node
      SAN_GENESIS_ALLOCATION: "${SAN_GENESIS_ALLOCATION:-}"
      SAN_BOOTSTRAP: "${SAN_BOOTSTRAP:-}"
    volumes:
      - node-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/bootstrap', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional Go implementation of the node with the LMDB backend:
  #   docker compose --profile go up -d --build san-node-go
  # The image entrypoint is "sanup --foreground"; key, database and peer cache
  # live in the san-go-data volume. Different host ports, so it can run next to
  # the Python `node` service.
  san-node-go:
    profiles: ["go"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: san-network-go:local
    ports:
      - "18000:8000"   # REST API
      - "18765:8765"   # gRPC P2P (block gossip + sync)
      - "18769:8769"   # gRPC P2P (controller votes)
      - "18770:8770"   # gRPC P2P (peer discovery / gossip)
    environment:
      SAN_HOST: "0.0.0.0"
      SAN_API_HOST: "0.0.0.0"
      SAN_ADVERTISE_HOST: "127.0.0.1"
      SAN_DB_BACKEND: "lmdb"
      SAN_DB_PATH: "/var/lib/san/node.db"
      SAN_KEY_FILE: "/var/lib/san/san_key.json"
      SAN_GENESIS_ALLOCATION: "${SAN_GENESIS_ALLOCATION:-}"
      SAN_BOOTSTRAP: "${SAN_BOOTSTRAP:-}"
    volumes:
      - san-go-data:/var/lib/san
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/sancli
        - --rpc
        - http://127.0.0.1:8000
        - health
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  node-data:
  san-go-data:
